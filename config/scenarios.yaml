# Market scenarios for the Security review.
#
# a. Historical stress windows. Returns are measured from the close of
#    `start` to the close of `end` on daily data (the first return counted is
#    the session after `start`). A window the candidate's history does not
#    fully cover is reported as "no data", never filled.
stress_windows:
  - {key: gfc,             name: "Global Financial Crisis",       start: "2007-10-09", end: "2009-03-09"}
  - {key: euro_crisis,     name: "Euro crisis 2011",              start: "2011-04-29", end: "2011-10-03"}
  - {key: oil_china,       name: "2015-16 oil / China",           start: "2015-05-21", end: "2016-02-11"}
  - {key: q4_2018,         name: "Q4 2018",                       start: "2018-09-20", end: "2018-12-24"}
  - {key: covid,           name: "COVID crash",                   start: "2020-02-19", end: "2020-03-23"}
  - {key: rate_shock_2022, name: "2022 rate shock",               start: "2022-01-03", end: "2022-10-14"}
  - {key: regional_banks,  name: "March 2023 regional banks",     start: "2023-03-08", end: "2023-03-24"}
  - {key: yen_carry,       name: "August 2024 yen carry unwind",  start: "2024-07-16", end: "2024-08-05"}
  - {key: tariffs_2025,    name: "April 2025 tariff sell-off",    start: "2025-04-02", end: "2025-04-08"}

# b. Regimes: one label per month, from simple rules. Every rule is
#    descriptive (which months were like this?), not a trading signal.
regimes:
  rising_yields:
    label: Rising 10-year yields
    opposite: Falling 10-year yields
    rule: yield_change
    series: ^TNX              # US 10-year Treasury yield, Yahoo Finance, percent
    lookback_months: 1        # change in month-end yield over this many months
  high_inflation:
    label: High inflation
    opposite: Low inflation
    rule: cpi_yoy
    sources:                  # tried in order; the first that answers is used
      - {kind: fred, series: CPIAUCSL, label: "US CPI-U (FRED CPIAUCSL)"}
      - {kind: boc,  series: V41690973, label: "Canada CPI, all items (Bank of Canada Valet V41690973)"}
    threshold_yoy: 0.03       # CPI year-on-year above this is "high inflation"
  equity_bear:
    label: Equity bear (below 10-month average)
    opposite: Equity bull (above 10-month average)
    rule: below_moving_average
    series: SPY               # adjusted close, USD
    ma_months: 10
    lag_months: 1             # month t is labelled from the close of month t-1 (no look-ahead)
  high_vol:
    label: High volatility (VIX above median)
    opposite: Low volatility (VIX below median)
    rule: above_expanding_median
    series: ^VIX
    min_history_months: 60    # the median only uses months before this one, from this many on
  stock_bond_down:
    label: Stocks and bonds both down
    opposite: Other months
    rule: both_negative       # 100% Equities profile and 100% Bonds profile, both in CAD
